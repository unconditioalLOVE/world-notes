<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WORLD NOTES</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
  <div id="app">
    <div id="map-container">
      <svg id="map-svg"></svg>
      <canvas id="draw-canvas"></canvas>
    </div>

    <div id="toolbar">
      <button id="btn-draw-mode" class="tool-btn" title="描画モード" aria-label="描画">
        <svg viewBox="0 0 24 24" class="icon"><path d="M4 20l4.5-1.5L18 9l-3-3L5.5 15.5 4 20zM15 6l3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="draw-tools" class="hidden">
        <button id="btn-pen" class="tool-btn active" title="ペン" aria-label="ペン">
          <svg viewBox="0 0 24 24" class="icon"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-eraser-normal" class="tool-btn" title="通常消しゴム" aria-label="通常消しゴム">
          <svg viewBox="0 0 24 24" class="icon"><path d="M7 17l-3-3 8-8 6 6-8 8H7zM14 8l2 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-eraser-stroke" class="tool-btn" title="線全体消去" aria-label="線全体消去">
          <svg viewBox="0 0 24 24" class="icon"><path d="M4 12h16M9 7l-2 10M15 7l2 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-eraser-all" class="tool-btn" title="全消し" aria-label="全消し">
          <svg viewBox="0 0 24 24" class="icon"><path d="M5 7h14M9 7V5h6v2M8 7l1 12h6l1-12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <input type="color" id="color-picker" value="#1a1a1a" title="色" />
        <input type="range" id="stroke-width" min="0.3" max="16" value="2" step="0.1" title="太さ" />
        <button id="btn-undo" class="tool-btn" title="元に戻す" aria-label="元に戻す">
          <svg viewBox="0 0 24 24" class="icon"><path d="M9 14l-4-4 4-4M5 10h9a5 5 0 010 10h-2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-redo" class="tool-btn" title="やり直し" aria-label="やり直し">
          <svg viewBox="0 0 24 24" class="icon"><path d="M15 14l4-4-4-4M19 10H10a5 5 0 000 10h2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <button id="btn-pin-mode" class="tool-btn" title="ピン追加モード" aria-label="ピン">
        <svg viewBox="0 0 24 24" class="icon"><path d="M12 21s-6-5.2-6-10a6 6 0 1112 0c0 4.8-6 10-6 10z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="11" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button id="btn-layers" class="tool-btn" title="レイヤー" aria-label="レイヤー">
        <svg viewBox="0 0 24 24" class="icon"><path d="M12 4l9 5-9 5-9-5 9-5zM3 14l9 5 9-5M3 18l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btn-rivers" class="tool-btn active" title="河川の表示" aria-label="河川">
        <svg viewBox="0 0 24 24" class="icon"><path d="M4 14c2-3 4-3 6 0s4 3 6 0 4-3 6 0M4 18c2-3 4-3 6 0s4 3 6 0 4-3 6 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-reset-view" class="tool-btn" title="表示リセット" aria-label="リセット">
        <svg viewBox="0 0 24 24" class="icon"><path d="M4 12a8 8 0 0114.5-4.8M20 12a8 8 0 01-14.5 4.8M4 6v5h5M20 18v-5h-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div id="layer-panel" class="panel hidden">
      <div class="panel-header">
        <h3>レイヤー</h3>
        <button id="btn-close-layers" class="close-btn" aria-label="閉じる">
          <svg viewBox="0 0 24 24" class="icon"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="layer-list"></div>
      <button id="btn-add-layer" class="primary-btn">レイヤーを追加</button>
    </div>

    <div id="memo-panel" class="panel hidden">
      <div class="panel-header">
        <h3 id="memo-title">ピンメモ</h3>
        <button id="btn-close-memo" class="close-btn" aria-label="閉じる">
          <svg viewBox="0 0 24 24" class="icon"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="memo-section">
        <label>タイトル</label>
        <input type="text" id="pin-title" placeholder="タイトル（任意）" />
      </div>
      <div class="memo-section">
        <label>メモ</label>
        <textarea id="pin-memo" placeholder="ここにメモを書く..."></textarea>
        <div class="btn-row">
          <button id="btn-save-pin" class="primary-btn">保存</button>
          <button id="btn-delete-pin" class="danger-btn">削除</button>
        </div>
      </div>
    </div>

    <div id="mode-hint" class="hidden"></div>
    <div id="toast" class="hidden"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
