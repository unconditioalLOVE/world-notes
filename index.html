<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WORLD NOTES</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
</head>
<body>
  <div id="app">

    <!-- 重なり順（下→上）：陸地+塗り → 落書き(国境の下) → 国境・河川 → 落書き/スタンプ/文字(国境の上) → ガイド線 → ピン → 工業スタンプ -->
    <div id="map-container">
      <svg id="svg-base"></svg>
      <canvas id="canvas-below"></canvas>
      <svg id="svg-lines"></svg>
      <canvas id="canvas-above"></canvas>
      <svg id="svg-guides"></svg>
      <svg id="svg-pins"></svg>
      <canvas id="canvas-top"></canvas>
    </div>

    <!-- テキスト編集（選択中のテキスト） -->
    <div id="text-editor" class="hidden">
      <div class="te-bar">
        <button id="te-move" class="te-btn" title="ドラッグで移動">
          <svg viewBox="0 0 24 24" class="icon"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          移動
        </button>
        <button id="te-del" class="te-btn danger" title="削除">
          <svg viewBox="0 0 24 24" class="icon"><path d="M5 7h14M9 7V5h6v2M8 7l1 12h6l1-12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          削除
        </button>
      </div>
      <textarea id="te-input" rows="1" spellcheck="false" placeholder="文字を入力"></textarea>
    </div>

    <div id="mode-hint" class="hidden"></div>
    <div id="loading">地図データを読み込み中…</div>

    <!-- ===== 下部メニュー ===== -->
    <div id="dock">

      <!-- 落書きオプション -->
      <div id="bar-draw" class="bar col hidden">
        <div class="row">
          <div class="seg" id="seg-sub">
            <button data-sub="pen">ペン</button>
            <button data-sub="eraser">消しゴム</button>
            <button data-sub="country-fill">国塗り</button>
            <button data-sub="lasso">投げ縄</button>
            <button data-sub="text">テキスト</button>
            <button data-sub="stamp">スタンプ</button>
            <button data-sub="note">メモ</button>
          </div>
        </div>

        <!-- ペン -->
        <div class="row opt" id="opt-pen">
          <span class="opt-label">線の位置</span>
          <div class="seg" id="seg-side">
            <button data-side="above">国境の上</button>
            <button data-side="below">国境の下</button>
          </div>
          <button id="btn-landonly" class="toggle" title="オンにすると、海の上には描けません（国境は跨げます）">国上のみ</button>
          <input type="color" id="color-picker" value="#1a1a1a" title="色" />
        </div>

        <!-- 消しゴム -->
        <div class="row opt hidden wrap" id="opt-eraser">
          <div class="seg flex1" id="seg-eraser">
            <button data-er="normal">消しゴム</button>
            <button data-er="stroke">線消し</button>
            <button data-er="fill">塗り消し</button>
            <button data-er="pin">ピン消し</button>
            <button data-er="stamp">スタンプ消し</button>
          </div>
          <button id="btn-clear-layer" class="chip-btn danger" title="このレイヤーの落書き・塗り・スタンプ・文字を全消し">全消し</button>
        </div>

        <!-- テキスト -->
        <div class="row opt hidden" id="opt-text">
          <span class="opt-label">文字色</span>
          <input type="color" id="text-color-picker" value="#1a1a1a" title="文字色" />
          <span class="opt-note">地図をタップして文字を置く</span>
        </div>

        <!-- スタンプ -->
        <div class="row opt hidden wrap" id="opt-stamp">
          <div class="seg" id="seg-cat"></div>
          <div class="seg" id="seg-stampmode">
            <button data-sm="tap">タップ</button>
            <button data-sm="lasso">投げ縄で敷き詰め</button>
          </div>
          <div class="seg" id="seg-stampsize" title="スタンプの大きさ">
            <button data-sz="S">小</button>
            <button data-sz="M">中</button>
            <button data-sz="L">大</button>
          </div>
          <button id="btn-overpin" class="toggle" title="オンにすると、ピン（都市）の近くをタップした時にピンの上へ半透明で重ねます">ピンに重ねる</button>
        </div>
        <div class="row opt hidden" id="opt-stamp-pal">
          <div id="stamp-pal" class="pal"></div>
        </div>

        <!-- 投げ縄の範囲 -->
        <div class="row opt hidden wrap" id="opt-target">
          <span class="opt-label">範囲</span>
          <div class="seg" id="seg-scope">
            <button data-scope="country">選んだ国</button>
            <button data-scope="all">全ての国</button>
          </div>
          <span id="target-name" class="target-name">未選択（国をタップ）</span>
          <button id="btn-target-clear" class="chip-btn hidden">解除</button>
        </div>

        <!-- 塗り・スタンプの位置 -->
        <div class="row opt hidden" id="opt-fillside">
          <span class="opt-label">位置</span>
          <div class="seg" id="seg-fillside">
            <button data-fs="above">国境の上</button>
            <button data-fs="below">国境の下</button>
          </div>
        </div>

        <!-- 模様・塗りつぶし（1行・横スクロールなし） -->
        <div class="row opt hidden" id="opt-pattern">
          <div class="fillrow">
            <button id="btn-solid" class="pchip compact solid" title="塗りつぶし（模様と重ねられます）"></button>
            <input type="color" id="solid-color" value="#111111" title="塗りつぶしの色" />
            <span class="vsep"></span>
            <div id="pattern-chips" class="chips compact"></div>
            <input type="color" id="fill-color" value="#111111" title="模様の色" />
          </div>
        </div>

        <!-- 太さ・大きさ -->
        <div class="row opt" id="opt-width">
          <span class="opt-label" id="width-label">太さ</span>
          <input type="range" id="size-slider" min="0" max="100" value="57" step="1" />
          <div id="size-prev" class="size-prev"></div>
          <span id="size-px" class="opt-note"></span>
        </div>
      </div>

      <!-- 編集ツール -->
      <div id="bar-edit" class="bar hidden">
        <div class="seg" id="seg-tool">
          <button data-tool="draw">落書き</button>
          <button data-tool="pin">ピン</button>
          <button data-tool="country">国メモ</button>
        </div>
        <button id="btn-undo" class="icon-btn" title="元に戻す" aria-label="元に戻す">
          <svg viewBox="0 0 24 24" class="icon"><path d="M9 14l-4-4 4-4M5 10h9a5 5 0 010 10h-2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-redo" class="icon-btn" title="やり直し" aria-label="やり直し">
          <svg viewBox="0 0 24 24" class="icon"><path d="M15 14l4-4-4-4M19 10H10a5 5 0 000 10h2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <!-- メインメニュー -->
      <div id="toolbar" class="bar">
        <button id="btn-edit" class="tab" aria-label="編集">
          <svg viewBox="0 0 24 24" class="icon"><path d="M4 20l4.5-1.5L18 9l-3-3L5.5 15.5 4 20zM15 6l3 3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="lbl-edit">編集</span>
        </button>
        <div class="tab-sep view-only"></div>
        <button id="view-pin" class="tab view-only" aria-label="ピンを見る">
          <svg viewBox="0 0 24 24" class="icon"><path d="M12 21s-6-5.2-6-10a6 6 0 1112 0c0 4.8-6 10-6 10z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="11" r="2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
          <span>ピン</span>
        </button>
        <button id="view-country" class="tab view-only" aria-label="国メモを見る">
          <svg viewBox="0 0 24 24" class="icon"><path d="M4 7l5-2 6 2 5-2v12l-5 2-6-2-5 2V7zM9 5v12M15 7v12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>国メモ</span>
        </button>
        <div class="tab-sep"></div>
        <button id="btn-layers" class="tab" aria-label="レイヤー">
          <svg viewBox="0 0 24 24" class="icon"><path d="M12 4l9 5-9 5-9-5 9-5zM3 14l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>レイヤー</span>
        </button>
        <button id="btn-rivers" class="tab active" aria-label="河川">
          <svg viewBox="0 0 24 24" class="icon"><path d="M4 9c2-3 4-3 6 0s4 3 6 0 4-3 6 0M4 15c2-3 4-3 6 0s4 3 6 0 4-3 6 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span>河川</span>
        </button>
        <button id="btn-reset-view" class="tab" aria-label="全体表示">
          <svg viewBox="0 0 24 24" class="icon"><path d="M4 12a8 8 0 0114.5-4.8M20 12a8 8 0 01-14.5 4.8M4 6v5h5M20 18v-5h-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>全体</span>
        </button>
      </div>
    </div>

    <!-- ===== レイヤーパネル（通常時も閲覧可） ===== -->
    <div id="layer-panel" class="panel hidden">
      <div class="panel-header">
        <h3>レイヤー</h3>
        <button id="btn-close-layers" class="close-btn" aria-label="閉じる">
          <svg viewBox="0 0 24 24" class="icon"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="layer-list"></div>
      <div class="layer-foot edit-only">
        <button id="btn-add-layer" class="primary-btn">レイヤーを追加</button>
      </div>
      <div class="layer-foot backup">
        <button id="btn-export" class="chip-btn">バックアップを保存</button>
        <button id="btn-import" class="chip-btn">復元</button>
        <input type="file" id="file-import" accept=".json,application/json" class="hidden" />
      </div>
    </div>

    <!-- ===== ピンパネル ===== -->
    <div id="pin-panel" class="panel hidden">
      <div class="panel-header">
        <h3 id="pin-head" class="edit-only">ピンを編集</h3>
        <button id="btn-close-pin" class="close-btn" aria-label="閉じる">
          <svg viewBox="0 0 24 24" class="icon"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="panel-body">
        <div class="view-card view-only">
          <div id="pin-v-badge" class="badge hidden">首都</div>
          <h2 id="pin-v-title"></h2>
          <p id="pin-v-memo" class="hidden"></p>
        </div>
        <div class="edit-only">
          <div class="memo-section">
            <label>属性</label>
            <div id="kind-chips" class="kind-chips"></div>
          </div>
          <div class="memo-section">
            <label>タイトル（空のままだと自動で削除されます）</label>
            <input type="text" id="pin-title" placeholder="タイトル" />
          </div>
          <div class="memo-section">
            <label>メモ</label>
            <textarea id="pin-memo" placeholder="ここにメモを書く..."></textarea>
            <div class="btn-row">
              <button id="btn-save-pin" class="primary-btn">保存</button>
              <button id="btn-delete-pin" class="danger-btn">削除</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== 国メモパネル ===== -->
    <div id="country-panel" class="panel hidden">
      <div class="panel-header">
        <h3 id="country-head" class="edit-only">国</h3>
        <button id="btn-close-country" class="close-btn" aria-label="閉じる">
          <svg viewBox="0 0 24 24" class="icon"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="panel-body">
        <div class="view-card view-only">
          <h2 id="country-v-title"></h2>
          <p id="country-v-memo" class="hidden"></p>
        </div>
        <div class="edit-only">
          <div class="memo-section">
            <label>メモ</label>
            <textarea id="country-memo" placeholder="この国についてのメモ..."></textarea>
            <div class="btn-row">
              <button id="btn-save-country" class="primary-btn">保存</button>
            </div>
          </div>
          <div class="memo-section">
            <label>国全体の塗り</label>
            <div class="fillrow">
              <div id="country-chips" class="chips compact"></div>
              <input type="color" id="country-color" value="#111111" title="色" />
            </div>
            <p class="note" id="country-layer-note"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== メモパネル（落書き内の小さなメモ） ===== -->
    <div id="note-panel" class="panel hidden">
      <div class="panel-header">
        <h3 class="edit-only">メモを編集</h3>
        <button id="btn-close-note" class="close-btn" aria-label="閉じる">
          <svg viewBox="0 0 24 24" class="icon"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="panel-body">
        <div class="view-card view-only"><p id="note-v-text" class="note-text"></p></div>
        <div class="edit-only">
          <div class="memo-section">
            <label>内容（空のままだと自動で削除されます）</label>
            <textarea id="note-text" placeholder="メモを書く..."></textarea>
            <div class="btn-row">
              <button id="btn-save-note" class="primary-btn">保存</button>
              <button id="btn-delete-note" class="danger-btn">削除</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="update-bar" class="hidden"><span>新しいバージョンがあります</span><button id="btn-update">更新</button></div>
    <div id="toast" class="hidden"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
